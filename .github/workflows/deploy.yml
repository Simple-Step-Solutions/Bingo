name: Deploy to Firebase

on:
  push:
    branches: [main]
  # Runs the gates (lint, rules tests) without deploying anything, so a broken
  # rules test surfaces on the PR instead of silently skipping deploy-rules
  # after the merge -- which would look like a green build with stale rules.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Pinned so a firebase-tools release cannot break the pipeline unannounced.
  FIREBASE_TOOLS: firebase-tools@14

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # workflow_dispatch gives paths-filter no base ref to diff against, so a
      # manual run treats everything as changed. That is the escape hatch for
      # pushing rules without an accompanying commit.
      hosting: ${{ steps.filter.outputs.hosting == 'true' || github.event_name == 'workflow_dispatch' }}
      functions: ${{ steps.filter.outputs.functions == 'true' || github.event_name == 'workflow_dispatch' }}
      rules: ${{ steps.filter.outputs.rules == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            hosting:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
            functions:
              - 'functions/**'
            rules:
              - 'firestore.rules'
              - 'storage.rules'
              - 'firestore.indexes.json'
              - 'firebase.json'
              - 'rules-tests/**'

  # Typecheck gates the hosting deploy. Without this a compile error
  # (see the trackActivity crash in src/pages/Map.tsx) ships to production.
  lint:
    needs: changes
    if: needs.changes.outputs.hosting == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  deploy-hosting:
    needs: [changes, lint]
    if: needs.changes.outputs.hosting == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@092436dca3ec6dacb231d965ae56f7ff6c09f258 # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sss-hvgcc-bingo
          channelId: live

  # Exercises firestore.rules against the emulator. Each test corresponds to a
  # real hole found in review, so a failure here means an exploit was reopened.
  test-rules:
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules

  # Firestore and Storage rules were previously never deployed by CI, so the
  # rules in this repo could drift from the rules actually protecting the data.
  #
  # firebase.json pins the named database explicitly via a "database" key.
  # Without that this job deploys to (default) and reports success while
  # changing nothing -- which is what used to happen by hand.
  #
  # That key MUST stay in the single-object form. In the array form,
  # firebase-tools reads everything after "firestore:" in --only as a database
  # or target name, so "firestore:rules" matches no entry and the config
  # resolves to nothing. The prepare step then bails without ever loading the
  # rules, and the deploy crashes with a bare "An unexpected error has
  # occurred" (a TypeError on undefined indexes, not a permissions problem).
  # Worse, --only firestore:rules on its own skips the crash and exits 0
  # having deployed nothing at all. See firestore/fsConfig.ts upstream.
  #
  # Index deletion is not a risk: firebase-tools only removes indexes that are
  # absent from firestore.indexes.json when passed --force, which this omits.
  #
  # The service account needs roles/firebaserules.admin. A 403 on the first run
  # means that role is missing, not that the config is wrong.
  deploy-rules:
    needs: [changes, test-rules]
    if: needs.changes.outputs.rules == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Prints which identity is actually deploying. A service account email is
      # not a secret, and without this a 403 leaves you guessing which of the
      # project's service accounts to grant roles to -- the one in the secret is
      # often not the one you assume.
      - name: Show deploying identity
        run: node -e "console.log('deploying as:', JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')).client_email)"

      # Firestore rules go FIRST and on their own.
      #
      # These were bundled with the Storage rules in a single command, which
      # meant a missing Storage permission blocked the Firestore security rules
      # from deploying at all -- the privilege escalation fixes sat undeployed
      # behind an unrelated bucket grant. Split so the important half lands
      # even when the other half cannot.
      #
      # The grep guards the silent-no-op case: when the firestore config fails
      # to resolve, firebase-tools can exit 0 having released no ruleset at
      # all. Shipping stale rules is a security regression that otherwise
      # reads as a green build, so assert the release happened instead of
      # trusting the exit code.
      - name: Deploy Firestore rules and indexes
        shell: bash
        run: |
          set -euo pipefail
          npx ${{ env.FIREBASE_TOOLS }} deploy \
            --only firestore:rules,firestore:indexes \
            --project sss-hvgcc-bingo --non-interactive 2>&1 | tee firestore-deploy.log
          grep -q "released rules" firestore-deploy.log || {
            echo "::error::Firestore deploy exited 0 but released no ruleset. The firestore entry in firebase.json is not resolving -- see the comment above this job."
            exit 1
          }

      # Storage rules are secondary: nothing in the game loop depends on them,
      # and they need firebasestorage.defaultBucket.get, which the Firebase
      # Admin SDK service account does not carry by default. Runs after, so a
      # failure here is visible without holding back Firestore.
      - name: Deploy Storage rules
        run: >
          npx ${{ env.FIREBASE_TOOLS }} deploy
          --only storage
          --project sss-hvgcc-bingo --non-interactive

      # firebase-tools prints "An unexpected error has occurred" and nothing
      # else when the real failure only reaches firebase-debug.log. Without
      # this a rules deploy failure is undiagnosable from CI alone.
      - name: Show firebase debug log
        if: failure()
        run: cat firebase-debug.log || echo "no firebase-debug.log produced"


  # Pure-logic tests for the callables: code normalisation, board generation,
  # win detection, geofence maths. No emulator and no credentials needed, so
  # this is fast and runs on every PR that touches functions/.
  test-functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm test
        working-directory: functions

  deploy-functions:
    needs: [changes, test-functions]
    if: needs.changes.outputs.functions == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Show deploying identity
        run: node -e "console.log('deploying as:', JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')).client_email)"

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy Cloud Functions
        run: >
          npx ${{ env.FIREBASE_TOOLS }} deploy
          --only functions --project sss-hvgcc-bingo --non-interactive
        env:
          FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}

      # firebase-tools prints "An unexpected error has occurred" and nothing
      # else when the real failure only reaches firebase-debug.log. Without
      # this a rules deploy failure is undiagnosable from CI alone.
      - name: Show firebase debug log
        if: failure()
        run: cat firebase-debug.log || echo "no firebase-debug.log produced"

